<span class="drink-water-widget">
  <button (click)="showDialog()" title="Click to view configuration">
    configure reminders
  </button>
</span>

<dialog id="reminders-dialog">
  <strong>Reminders</strong>
  <br />

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Start Time</th>
        <th>Duration (minutes)</th>
        <th>Active</th>
        <th>Launch</th>
        <th>Delete</th>
        <th>Next occurrence</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of viewData.reminders; track item.id) {
      <tr>
        <td>
          <input
            type="text"
            [(ngModel)]="reminderDrafts[item.id].title"
            aria-label="Description"
          />
        </td>
        <td>
          <input
            type="time"
            [(ngModel)]="reminderDrafts[item.id].startTime"
            aria-label="Start time"
          />
        </td>
        <td>
          <input
            type="number"
            min="1"
            [(ngModel)]="reminderDrafts[item.id].schedule"
            aria-label="Duration in minutes"
          />
        </td>
        <td>
          <input
            type="checkbox"
            [ngModel]="item.started"
            (ngModelChange)="setReminderRunning(item, $event)"
            [attr.aria-label]="'Active reminder: ' + item.title"
          />
        </td>
        <td>
          <input
            type="checkbox"
            [ngModel]="item.selectedForLaunch"
            (ngModelChange)="setLaunchSelection(item, $event)"
            [attr.aria-label]="'Launch reminder: ' + item.title"
          />
        </td>
        <td>
          <input
            *ngIf="item.custom"
            type="checkbox"
            [(ngModel)]="item.selectedForDeletion"
            [attr.aria-label]="'Delete reminder: ' + item.title"
          />
        </td>
        <td>{{ item.nextOcurrence | date: "yyyy-MM-dd HH:mm" }}</td>
        <td><button (click)="applyChanges(item)">apply changes</button></td>
      </tr>
      }
    </tbody>
  </table>

  <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
  <button (click)="deleteSelectedCustomReminders()">
    delete selected custom reminders
  </button>
  <fieldset>
    <legend>Add reminder</legend>
    <label>
      Description
      <input type="text" [(ngModel)]="newReminder.title" />
    </label>
    <label>
      Start time
      <input type="time" [(ngModel)]="newReminder.startTime" />
    </label>
    <label>
      Duration (minutes)
      <input type="number" min="1" [(ngModel)]="newReminder.schedule" />
    </label>
    <button (click)="addReminder()">add reminder</button>
  </fieldset>

  <br />
  <button (click)="launchReminders()">launch reminders</button>
  <button (click)="stopReminders()">stop reminders</button>
  <button (click)="clearReminderNotifications()">
    clear reminder notifications
  </button>
  <br />
  <button (click)="closeDialog()">close dialog</button>
  <br />
  <br />
  <button (click)="toggleDarkMode()">toggle dark mode</button>
</dialog>
